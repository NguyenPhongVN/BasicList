name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pin the latest stable Xcode on the image — the default can change
      # over time; tools 6.3 requires Swift >= 6.3.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # The load-more engine is only covered by the iOS simulator suite
  # (LoadMoreSimulatorTests compiles empty on a macOS host — see
  # Docs/LoadMoreVerification.md §6). It MUST run on every change to the
  # probe/sentinel/gate. The destination is resolved at run time — runner
  # images ship different simulator sets (macos-26 has no "iPhone 18 Pro
  # Max"), and the harness builds its own fixed 390×844 window, so any
  # iPhone model works geometry-wise.
  simulator-suite:
    name: Load-more simulator suite
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          PREFERRED="iPhone 18 Pro Max"
          if xcrun simctl list devices available | grep -q "$PREFERRED ("; then
            NAME="$PREFERRED"
          else
            NAME=$(xcrun simctl list devices available | awk -F ' \\(' '/iPhone/{sub(/^ +/, "", $1); print $1; exit}')
          fi
          echo "Picked simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        run: xcodebuild test -scheme BasicList -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" -only-testing:BasicListTests/LoadMoreSimulatorTests
