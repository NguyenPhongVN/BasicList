name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        # Every deviation from defaults is documented with a reason in
        # .swiftlint.yml — the file IS the project's code-standard spec.
        run: swiftlint lint --strict --quiet

  # ONE consolidated heavy job on macos-15 — the macos-26 pool was under a
  # capacity crunch (runs #13–#15): queued jobs were cancelled after exactly
  # ~15 min without ever receiving a runner, while tiny jobs got through.
  # macos-15 is a mature image with the SAME toolchain the work needs
  # (Xcode 26.3 → Swift 6.3, iOS 26.2 simulator runtime). Everything runs
  # sequentially on one runner: host build+tests, then the two simulator
  # suites in SEPARATE xcodebuild invocations (they are @MainActor with
  # blocking RunLoop pumps and swift-testing serializes WITHIN each suite
  # only — one invocation interleaves their measurement windows and perturbs
  # the load-more timing assertions, run #11).
  #
  # Diagnostics: every step writes its toolchain evidence / failure tail to
  # $GITHUB_STEP_SUMMARY — the job log itself needs admin auth to read via
  # the API, the check-run summary does not.
  test:
    name: Test (host + iOS simulator)
    runs-on: macos-15
    # The failure path commits diagnostics.md (+ raw logs) back to main so
    # diagnosis works without any repository credentials on the reading side.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # PIN the Xcode version — tools 6.3 needs Swift >= 6.3 (Xcode 26.2+).
      # Do NOT use latest-stable here: the macos-15 image DEFAULTS to Xcode
      # 16.4 (Swift 6.1), and a resolution fallback to the default fails
      # `swift build` instantly with "requires Swift 6.3" (run #16+ symptom:
      # exit 1 on the very first build step). 26.3 is explicitly listed on
      # the macos-15 image (Xcode_26.3.app, build 17C529).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Toolchain evidence
        run: |
          {
            echo "### Toolchain"
            echo '```'
            xcodebuild -version
            swift --version 2>&1
            xcrun simctl list runtimes | grep iOS
            echo '```'
          } | tee -a diagnostics.md

      - name: Build (host)
        run: |
          if ! swift build 2> build_err.log; then
            {
              echo "### swift build — FAILED, last 80 lines"
              echo '```'
              tail -80 build_err.log
              echo '```'
            } | tee -a diagnostics.md
            exit 1
          fi

      - name: Test (host — vocabulary, gate, wiring)
        run: |
          if ! swift test 2> test_err.log; then
            {
              echo "### swift test — FAILED, last 80 lines"
              echo '```'
              tail -80 test_err.log
              echo '```'
            } | tee -a diagnostics.md
            exit 1
          fi

      # Pick the simulator AFTER Xcode selection — the image ships different
      # simulator sets per Xcode, and the harness builds its own fixed
      # 390×844 window, so any iPhone model works geometry-wise.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          PREFERRED="iPhone 18 Pro Max"
          if xcrun simctl list devices available | grep -q "$PREFERRED ("; then
            NAME="$PREFERRED"
          else
            NAME=$(xcrun simctl list devices available | awk -F ' \\(' '/iPhone/{sub(/^ +/, "", $1); print $1; exit}')
          fi
          echo "Picked simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The interaction suite inspects the a11y tree, which SwiftUI only
      # materializes when accessibility is enabled. On iOS 26.5+ the harness
      # notifications alone suffice (verified on a fresh simulator), but the
      # runner's older runtimes (≤26.2) need the accessibility defaults —
      # write them before the test run boots the simulator. AFTER the pick —
      # it reads the chosen device's name.
      - name: Enable accessibility on the simulator
        run: |
          NAME="${{ steps.sim.outputs.name }}"
          UDID=$(xcrun simctl list devices | grep "$NAME (" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          echo "Enabling accessibility on $NAME ($UDID)"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility AccessibilityEnabled -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ApplicationAccessibilityEnabled -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility AuditInspectionModeEnabled -bool YES

      - name: Test (load-more simulator suite)
        run: |
          if ! xcodebuild test -scheme BasicList \
               -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
               -only-testing:BasicListTests/LoadMoreSimulatorTests > xc_loadmore.log 2>&1; then
            {
              echo "### LoadMore simulator suite — FAILED, last 120 lines"
              echo '```'
              tail -120 xc_loadmore.log
              echo '```'
            } | tee -a diagnostics.md
            exit 1
          fi

      - name: Test (interaction simulator suite)
        run: |
          if ! xcodebuild test -scheme BasicList \
               -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
               -only-testing:BasicListTests/InteractionSimulatorTests > xc_interaction.log 2>&1; then
            {
              echo "### Interaction simulator suite — FAILED, last 120 lines"
              echo '```'
              tail -120 xc_interaction.log
              echo '```'
            } | tee -a diagnostics.md
            exit 1
          fi

      # Diagnostics channel — the job log API needs admin auth and
      # GITHUB_STEP_SUMMARY is not reflected in the check-run output; instead
      # the failure path commits diagnostics.md (+ raw logs) straight into the
      # repository ([skip ci] prevents a CI loop).
      - name: Commit diagnostics
        if: failure()
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "actions@github.com"
          git add diagnostics.md build_err.log test_err.log xc_loadmore.log xc_interaction.log || true
          git commit -m "ci: diagnostics bundle [skip ci]" || true
          git push || true
