name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pin the latest stable Xcode on the image — the default can change
      # over time; tools 6.3 requires Swift >= 6.3.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # The load-more engine is only covered by the iOS simulator suite
  # (LoadMoreSimulatorTests compiles empty on a macOS host — see
  # Docs/LoadMoreVerification.md §6). It MUST run on every change to the
  # probe/sentinel/gate; destination mirrors the documented local command —
  # if a runner image lacks this simulator name, swap the destination here.
  simulator-suite:
    name: Load-more simulator suite (iPhone 18 Pro Max)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: xcodebuild test -scheme BasicList -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max' -only-testing:BasicListTests/LoadMoreSimulatorTests
